<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--forest: #0C2218;
--deep: #071610;
--mid: #163828;
--accent: #4EB86A;
--accent2: #3a9e54;
--text: #F0F5F0;
--muted: #7DAB8A;
--rule: rgba(78,184,106,0.18);
}

html { scroll-behavior: smooth; }
body {
background: var(--forest);
color: var(--text);
font-family: 'Inter', sans-serif;
font-size: 16px;
line-height: 1.6;
overflow-x: hidden;
}

/* ── NAV ── */
nav {
position: fixed; top: 0; left: 0; right: 0; z-index: 100;
display: flex; align-items: center; justify-content: space-between;
padding: 18px 44px;
background: linear-gradient(to bottom, rgba(7,22,16,0.92) 0%, transparent 100%);
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.2rem; font-weight: 700;
letter-spacing: 0.06em;
color: var(--accent); text-decoration: none;
}

/* ── APP STORE BADGE (green) ── */
.appstore-badge {
display: inline-flex; align-items: center; gap: 11px;
background: var(--accent);
color: #fff;
padding: 11px 22px; border-radius: 12px;
text-decoration: none;
border: none;
transition: background 0.2s, transform 0.15s;
}
.appstore-badge:hover { background: var(--accent2); transform: translateY(-1px); }
.appstore-badge-text { display: flex; flex-direction: column; line-height: 1.25; }
.appstore-badge-text .badge-small { font-size: 0.62rem; letter-spacing: 0.04em; opacity: 0.9; }
.appstore-badge-text .badge-large { font-weight: 700; }

/* ── HERO ── */
.hero {
position: relative;
height: 100vh; min-height: 600px;
display: flex; align-items: flex-end;
overflow: hidden;
}
